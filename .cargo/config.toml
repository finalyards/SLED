[build]
target = "riscv32imac-esp-espidf"

[unstable]
build-std = ["std", "panic_abort"]

[target.riscv32imac-esp-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"

rustflags = [
    "-C", "force-frame-pointers",  # recommended for proper stack traces
    "--cfg", "espidf_time64",      # must be set for ESP-IDF 5.0 and above
]

[env]
MCU = "esp32c6"

# We occasionally swap the target between:
#   - latest ESP-IDF 5.5.x
#   - latest ESP-IDF 6.x
#
# Builds on earlier versions _may_ succeed but are not tested against. The version restrictions come from:
#   - 'espressif/led_strip' component (ESP-IDF 5.2+)
#   - esp-idf-sys
#   - in addition, the 'build.rs' (bindings) will need tuning for other-than-supported versions
#
# Report here if you use the library with older ESP-IDF versions and it works.
#
#ESP_IDF_VERSION = "6.1"
ESP_IDF_VERSION = "5.5.6"

ESP_IDF_TOOLS_INSTALL_DIR = "global"
    # "out":        '{cargo output}/espressif'
    # "global":     '~/.espressif'; needs 'ldproxy'

# This is needed if you are using a global 'target' folder (vital e.g. when using a VM). Without it, 'embuild' does
# not find the files (e.g. 'wrap.h', 'sdkconfig.defaults') within the project root. It then fails the build, not
# having the bindings.
#
# A comment in 'esp-idf-sys' implies this could be changed, in embuild, at some point. But there's no tracking
# issue for that. (Aug'26; embuild 0.33.3)
#
CARGO_WORKSPACE_DIR = { value = "", relative = true }

# Suppress some 'esp-idf-sys' warnings:
#   <<
#       [esp-idf-sys 0.38.1] clang diag: /home/ubuntu/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/esp-idf-sys-0.37.2/src/include/esp-idf/bindings.h:383:5: warning: macro expansion producing 'defined' has undefined behavior [-Wexpansion-to-defined]
#   <<
BINDGEN_EXTRA_CLANG_ARGS="-Wno-expansion-to-defined"

# By default, ESP-IDF brings in all kinds of components. This is a mechanism to cut their list, but maintaining a
# suitable list is tedious. Best to run with defaults, for now.
#
#ESP_IDF_COMPONENTS = """\
#   ...,... \
#"""
