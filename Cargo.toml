[package]
name = "sled"
version = "0.0.1"
edition = "2024"
rust-version = "1.99"

# Available versions (ESP Registry):
#   -> https://components.espressif.com/components/espressif/led_strip/versions/3.1.1/readme
#
# Also:
#   -> https://esp-rs.github.io/esp-idf-sys/esp_idf_sys/#extra-esp-idf-components
#
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/led_strip", version = "3.1.1" }

[dependencies]
log = { version = "0.4" }

esp-idf-sys = { version = "0.38.1", default-features = false, features = ["native"] }
    #
    # Carries ESP-IDF headers, libraries, pulls in external component(s).
    # Needs to be under '[dependencies]' since it carries libraries that end up in the product.

[dev-dependencies]
esp-idf-svc = { version = "0.53.0", features = ["critical-section", "embassy-time-driver", "native"] } # "embassy-sync"

embassy-executor = { version = "0.10", features = ["executor-thread", "platform-std"] }
#embassy-sync     = { version = "0.8.0" }

#embassy-time = { version = "0.5" }
    # no need for feature "generic-queue-8" when both 'embassy-time' and 'embassy-executor' are being used.
    #   /source: comment in esp-idf-template generated bare bones Cargo.toml

[build-dependencies]
cc = { version = "1.10" }
bindgen = { version = "0.73" }
embuild = {  version = "0.33", features = ["espidf"] }

[features]
default = ["espressif_devkit_m1"]

_gpio_8 = []
_color_mode_grb = []

espressif_devkit_m1 = ["_gpio_8", "_color_mode_grb"]
espressif_devkit_c1 = ["_gpio_8", "_color_mode_grb"]

[profile.release]
opt-level = "s"

# Take latest/specific git versions.
#
#|[patch.crates-io]
#|esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf" } #, rev = "..."
#|esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf" }
#|esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf" }
